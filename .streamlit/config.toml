[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
linkColor = "#1c5cab"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontSizes = ["2.3rem", "1.6rem", "1.3rem"]
headingFontWeights = [700, 650, 600]
baseRadius = "0.6rem"
borderColor = "#e1e0d9"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#f5f4f0"
secondaryBackgroundColor = "#ebeae4"
